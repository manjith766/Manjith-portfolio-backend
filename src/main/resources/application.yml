server:
  port: ${PORT:8080}

spring:
  application:
    name: portfolio-backend

  datasource:
    url: jdbc:postgresql://ep-billowing-field-azbjwbek-pooler.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
    username: neondb_owner
    password: npg_rCVc4lLOX3wx
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 20
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 6MB

logging:
  level:
    root: INFO
    com.manjith.portfolio: DEBUG
    org.hibernate.SQL: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-before-deploy-please-this-is-not-secure-enough-for-prod-usage}
  access-token-expiration-ms: ${JWT_ACCESS_EXP_MS:900000}
  refresh-token-expiration-ms: ${JWT_REFRESH_EXP_MS:604800000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:changeme}
  api-key: ${CLOUDINARY_API_KEY:changeme}
  api-secret: ${CLOUDINARY_API_SECRET:changeme}